[project]
name = "om0rx-radio-control"
version = "0.1.0"
description = "Local FlexRadio control app with SDC, WSJT-X, Wavelog, QRZ, rotor, and FT8 integrations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "websockets>=13.0",
  "aiohttp>=3.10.0",
  "httpx>=0.28.0",
  "requests>=2.32.0",
  "duckdb>=1.1.0",
  "mysql-connector-python>=9.0.0",
  "pymysql>=1.1.0",
  "numpy>=2.0.0",
  "scipy>=1.14.0",
  "sounddevice>=0.5.0",
  "pywebview>=5.3.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "radio_control*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests/smoke"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  "docs/archive",
  "vendor",
  "node_modules",
]
