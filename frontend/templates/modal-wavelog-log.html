        <!-- Wavelog Log Modal -->
        <div class="wavelog-log-modal" @click.self="hideWavelogLog">
            <div class="wavelog-log-content">
                <div class="wavelog-log-header">
                    <h2>🌐 Wavelog QSO Log</h2>
                    <div class="wavelog-log-header-controls">
                        <span class="wavelog-refresh-timestamp" id="wavelog-refresh-time" title="Last refreshed time">⏱️ Ready</span>
                        <button class="wavelog-log-refresh-btn" @click="refreshWavelogLog" id="wavelog-btn-refresh" title="Refresh contacts from Wavelog">🔄 Refresh</button>
                        <button class="wavelog-log-close-btn" @click="hideWavelogLog">✕</button>
                    </div>
                </div>
                
                <div class="wavelog-log-filters">
                    <div class="filter-group">
                        <label>Callsign:</label>
                        <input type="text" id="wavelog-filter-callsign" placeholder="Search callsign..." class="filter-input">
                    </div>
                    <div class="filter-group">
                        <label>Mode:</label>
                        <select id="wavelog-filter-mode" class="filter-input">
                            <option value="">All Modes</option>
                            <option value="CW">CW</option>
                            <option value="SSB">SSB</option>
                            <option value="USB">USB</option>
                            <option value="LSB">LSB</option>
                            <option value="FM">FM</option>
                            <option value="AM">AM</option>
                            <option value="RTTY">RTTY</option>
                            <option value="FT8">FT8</option>
                            <option value="FT4">FT4</option>
                            <option value="JT65">JT65</option>
                            <option value="PSK">PSK</option>
                            <option value="DIGI">DIGI</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Band:</label>
                        <select id="wavelog-filter-band" class="filter-input">
                            <option value="">All Bands</option>
                            <option value="160m">160m</option>
                            <option value="80m">80m</option>
                            <option value="60m">60m</option>
                            <option value="40m">40m</option>
                            <option value="30m">30m</option>
                            <option value="20m">20m</option>
                            <option value="17m">17m</option>
                            <option value="15m">15m</option>
                            <option value="12m">12m</option>
                            <option value="10m">10m</option>
                            <option value="6m">6m</option>
                            <option value="2m">2m</option>
                            <option value="70cm">70cm</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Awards:</label>
                        <select id="wavelog-filter-awards" class="filter-input">
                            <option value="">All QSOs</option>
                            <option value="POTA">POTA</option>
                            <option value="SOTA">SOTA</option>
                            <option value="WWFF">WWFF</option>
                            <option value="IOTA">IOTA</option>
                        </select>
                    </div>
                </div>
                
                <div class="wavelog-log-table-container">
                    <table class="wavelog-log-table">
                        <thead>
                            <tr>
                                <th class="th-date">Date</th>
                                <th class="th-time">Time (UTC)</th>
                                <th class="th-call">Callsign</th>
                                <th class="th-freq">Freq (MHz)</th>
                                <th class="th-band">Band</th>
                                <th class="th-mode">Mode</th>
                                <th class="th-rst">RST</th>
                                <th class="th-dxcc">DXCC</th>
                                <th class="th-awards">Awards</th>
                                <th class="th-name">Name/QTH</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
                
                <div class="wavelog-log-pagination">
                    <div class="pagination-controls">
                        <button @click="wavelogLogPrevPage" class="btn-nav" id="wavelog-btn-prev-page">← Prev</button>
                        <div class="pagination-info">
                            <span class="wavelog-log-pagination-info">Loading...</span>
                        </div>
                        <button @click="wavelogLogNextPage" class="btn-nav" id="wavelog-btn-next-page">Next →</button>
                    </div>
                    <div class="pagination-settings">
                        <label>Show per page:</label>
                        <select @change="setWavelogLogItemsPerPage($event.target.value)" class="items-per-page-select">
                            <option value="10">10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                            <option value="250">250</option>
                            <option value="500">500</option>
                        </select>
                        <button @click="exportWavelogLogAsCSV" class="btn-export" title="Export filtered QSOs as CSV">📥 Export CSV</button>
                    </div>
                </div>
            </div>
