name: quality

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/maintenance/check_project.ps1
      - run: dotnet build tools/Om0rxAgent/Om0rxAgent.csproj --configuration Release
