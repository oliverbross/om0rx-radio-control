[project]
name = "om0rx-radio-control"
version = "2.0.0"
description = "Local FlexRadio control app with SDC, WSJT-X, Wavelog, QRZ, rotor, and FT8 integrations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "websockets>=13.0",
  "aiohttp>=3.10.0",
  "httpx>=0.28.0",
  "requests>=2.32.0",
  "duckdb>=1.1.0",
  "psycopg[binary]>=3.2.0",
  "mysql-connector-python>=9.0.0",
  "pymysql>=1.1.0",
  "numpy>=2.0.0",
  "scipy>=1.14.0",
  "sounddevice>=0.5.0",
  "soundcard>=0.4.6",
  "pywebview>=5.3.0",
  "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]
browser = [
  "playwright>=1.45.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "radio_control*", "services*", "activity_intelligence*"]

[tool.pytest.ini_options]
testpaths = ["tests/smoke"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  "docs/archive",
  "vendor",
  "node_modules",
]
